services:
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80" # Exposes standard HTTP web traffic to the world
    volumes:
      # 📂 Maps the nginx.conf uploaded by Ansible into the container's configuration room
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - crud-mongodb
    restart: always

  crud-mongodb:
    # 🚀 Pulls the compiled standalone image directly from Docker Hub instead of building it
    image: ${DOCKERHUB_USERNAME}/crud-mongodb:${IMAGE_TAG:-stage}
    # ❌ Completely removes build instructions and local volumes
    build: !reset null
    volumes: !reset []
    # ports:
      # - "3000:3000"
    restart: always
    environment:
      - MONGODB_URI=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb:27017
      - MONGODB_DB=${MONGODB_DB}
    depends_on:
      - mongodb

  mongodb:
    ports:
      - "127.0.0.1:27019:27017"
    restart: always

  # 🛑 Disabled entirely for security
  mongodb-express: !reset null
