name: Ansible Deployment

on:
  workflow_dispatch: # Allows you to press a button to manually update dropletB

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # - name: Install Ansible and DigitalOcean collection
      #   run: |
      #     pip install ansible
      #     ansible-galaxy collection install community.digitalocean

      # Sets up the private key needed to SSH into the droplets securely
      - name: Set up SSH Private Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Generate Dynamic Host File via API
        run: |
          # Query DigitalOcean API directly for the Droplet IP matching your tag
          IP=$(curl -s -X GET "https://api.digitalocean.com/v2/droplets" \
            -H "Authorization: Bearer ${{ secrets.DIGITALOCEAN_TOKEN }}" \
            | jq -r '.droplets[] | select(.tags | index("crud_mongodb")) | .networks.v4[] | select(.type=="public") | .ip_address')

          echo "Discovered Droplet IP: $IP"

          # Create inventory directory and write standard INI format matching your playbook group
          mkdir -p inventory
          echo -e "[tag_crud_mongodb]\n$IP ansible_user=root" > inventory/hosts.ini
        shell: bash
      - name: Run Playbook
        run: ansible-playbook -i inventory/hosts.ini site.yaml
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
