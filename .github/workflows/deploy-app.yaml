name: Ansible Deployment

on:
  workflow_dispatch: # Allows you to press a button to manually update dropletB

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # - name: Install Ansible and DigitalOcean collection
      #   run: |
      #     pip install ansible
      #     ansible-galaxy collection install community.digitalocean

      # Sets up the private key needed to SSH into the droplets securely
      - name: Set up SSH Private Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Diagnose and Generate Host File
        run: |
          echo "Fetching droplets from DigitalOcean API..."
          RESPONSE=$(curl -s -X GET "https://api.digitalocean.com/v2/droplets" \
            -H "Authorization: Bearer ${{ secrets.DIGITALOCEAN_TOKEN }}")

          echo "Raw API Response Summary:"
          echo "$RESPONSE" | jq -r '.droplets[]? | "Droplet: \(.name) | Tags: \(.tags | join(", "))"'

          # Try to grab the IP using your tag, or fallback to the first available droplet if tag is missing
          IP=$(echo "$RESPONSE" | jq -r '.droplets[] | select(.tags[]? == "crud_mongodb") | .networks.v4[] | select(.type=="public") | .ip_address' | head -n 1)

          if [ -z "$IP" ] || [ "$IP" = "null" ]; then
            echo "Warning: No droplet found with tag 'crud_mongodb'. Falling back to the first available droplet..."
            IP=$(echo "$RESPONSE" | jq -r '.droplets[0].networks.v4[] | select(.type=="public") | .ip_address' | head -n 1)
          fi

          echo "Using Droplet IP: '$IP'"

          if [ -z "$IP" ] || [ "$IP" = "null" ]; then
            echo "Error: No public IP could be found at all in this DigitalOcean account!"
            exit 1
          fi

          mkdir -p inventory
          echo -e "[tag_crud_mongodb]\n$IP ansible_user=root" > inventory/hosts.ini
        shell: bash
      - name: Run Playbook
        run: ansible-playbook -i inventory/hosts.ini site.yaml
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
