name: Ansible Deployment

on:
  workflow_dispatch: # Allows you to press a button to manually update dropletB

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible and DigitalOcean collection
        run: |
          pip install ansible
          ansible-galaxy collection install community.digitalocean

      # Sets up the private key needed to SSH into the droplets securely
      - name: Set up SSH Private Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Set up Python & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          sudo pip install pydo requests ansible

      - name: Install Official DigitalOcean Collection
        run: |
          ansible-galaxy collection install digitalocean.cloud --force

      - name: Run Playbook
        run: ansible-playbook -i inventory/digitalocean.yaml site.yaml
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
